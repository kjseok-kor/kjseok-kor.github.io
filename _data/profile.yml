  - >-
    I am a post-master's researcher at
    <a href="https://www.etri.re.kr/eng/main/main.etri">ETRI</a>, Korea, working on multimodal generative modeling with large language models.
    I received my M.S. in Computer Science from Chungbuk National University, advised by
    <a href="https://scholar.google.co.kr/citations?user=PA6LfawAAAAJ">Prof. Ohyun Jo</a>.
  - >-
    My research focuses on machine learning for heterogeneous and multimodal data, especially
    representation learning, efficient models, and generative modeling.

# About text. Each item is one paragraph; HTML links are allowed.
about:
  - >-
    I am a post-master's researcher at the
    <a href="https://www.etri.re.kr/eng/main/main.etri">Electronics and Telecommunications Research Institute (ETRI)</a>, Korea.
    I received my M.S. in Computer Science from Chungbuk National University, advised by
    <a href="https://scholar.google.co.kr/citations?user=PA6LfawAAAAJ">Prof. Ohyun Jo</a>,
    where I received the Outstanding Graduate Researcher Award.
  - >-
    My research focuses on multimodal learning, self-supervised representation learning, and efficient AI.
    I have worked on complex-valued wireless signals, underwater channels, audio, and heterogeneous clinical data,
    across national projects on 5G+ base stations, IoT edge AI, and underwater surveillance.
